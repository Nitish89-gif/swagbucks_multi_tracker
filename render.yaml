services:
  - type: web
    name: swagbucks-multi-tracker
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HEADLESS
        value: "true"
      - key: MAX_CONCURRENT_CHECKS
        value: "2"
      - key: CHECK_INTERVAL_SECONDS
        value: "60"
      - key: BALANCE_THRESHOLD
        value: "530"
      - key: MOBILE_ALERTS_ENABLED
        value: "true"
      - key: MOBILE_PUSH_TOPIC
        value: "sb_alerts_9676061877"
      - key: EMAIL_ALERTS_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: "nitishjaya2005@gmail.com"
      - key: ALERT_EMAIL_FROM
        value: "nitishjaya2005@gmail.com"
      - key: ALERT_EMAIL_TO
        value: "pasumarthinitish@gmail.com"
